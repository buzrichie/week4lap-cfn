AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Cluster, Service, and Task Definition

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: String
  PrivateSubnet1:
    Type: String
  PrivateSubnet2:
    Type: String
  ALBSecurityGroupId:
    Type: String
  TargetGroupBlueArn:
    Type: String
  RDSSecretArn:
    Type: String
  ContainerPort:
    Type: Number
    Default: 8080
  ECSServiceSecurityGroupId:
    Type: String
    Description: Security group ID created in NetworkStack for ECS service tasks

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cluster"

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        # Allow ECS tasks to read the DB credentials from Secrets Manager
        - PolicyName: SecretRetrievalPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref RDSSecretArn

        # Allow ECS tasks to pull images from ECR
        - PolicyName: ECRAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:GetRepositoryPolicy
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-repo

        # Allow ECS tasks to fetch layers stored in S3 (ECR depends on this)
        - PolicyName: ECRS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - arn:aws:s3:::aws-ecr-*
                  - arn:aws:s3:::aws-ecr-*/*
      RoleName: !Sub "${ProjectName}-ecsTaskExecutionRole"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ecsTaskExecutionRole"

  # -----------------------------
  # ECS Task Role (App Role)
  # -----------------------------
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      RoleName: !Sub "${ProjectName}-ecsTaskRole"
      Policies:
        - PolicyName: AppAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Secrets Manager permissions for DB credentials
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref RDSSecretArn

              # S3 permissions for storing images
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-images-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::${ProjectName}-images-${AWS::AccountId}/*"

              # RDS permissions if you need IAM DB auth (optional)
              - Effect: Allow
                Action:
                  - "rds-db:connect"
                Resource:
                  - !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/admin"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ecsTaskRole"

  # Inline policy for S3, RDS, Secrets Manager
  ECSTaskRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-ecsTaskRolePolicy"
      Roles:
        - !Ref ECSTaskRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # S3 permissions for image storage
          - Effect: Allow
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:DeleteObject"
              - "s3:ListBucket"
            Resource:
              - !Sub "arn:aws:s3:::${ProjectName}-images-${AWS::AccountId}"
              - !Sub "arn:aws:s3:::${ProjectName}-images-${AWS::AccountId}/*"

          # RDS permissions for database access
          - Effect: Allow
            Action:
              - "rds-db:connect"
            Resource:
              - !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/admin"

          # Secrets Manager for RDS credentials
          - Effect: Allow
            Action:
              - "secretsmanager:GetSecretValue"
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}-rds-credentials*"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}"
      RetentionInDays: 7
      Tags:
        - Key: Name
          Value: !Sub "/ecs/${ProjectName}"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: 256
      Memory: 512
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${ProjectName}-container"
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-repo:latest"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Essential: true
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET_NAME
              Value: !Sub "${ProjectName}-images-${AWS::AccountId}"
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}-rds-credentials"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-task-def"

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-service"
      LaunchType: FARGATE
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DeploymentController:
        Type: CODE_DEPLOY
      DesiredCount: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref ECSServiceSecurityGroupId
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
      LoadBalancers:
        - ContainerName: !Sub "${ProjectName}-container"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroupBlueArn
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-service"

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
  ServiceName:
    Description: Name of the ECS service
    Value: !GetAtt ECSService.Name
  TaskExecutionRoleArn:
    Value: !GetAtt ECSTaskExecutionRole.Arn
  TaskRoleArn:
    Description: IAM Role assumed by ECS tasks for S3/RDS access
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: !Sub "${ProjectName}-TaskRoleArn"
  LogGroupName:
    Value: !Ref LogGroup
  ContainerName:
    Value: !Sub "${ProjectName}-container"

AWSTemplateFormatVersion: "2010-09-09"
Description: PostgreSQL RDS stack (private, only accessible from ECS tasks)

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: String
  PrivateSubnet1:
    Type: String
  PrivateSubnet2:
    Type: String
  RDSSecurityGroupId:
    Type: String
    Description: Pre-created RDS Security Group from NetworkStack

Resources:
  # Subnet group for RDS (must be in private subnets)
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} DB Subnet Group"
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db-subnet-group"

  # RDS credentials stored in Secrets Manager
  RDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}-rds-credentials"
      Description: RDS credentials for PostgreSQL
      GenerateSecretString:
        SecretStringTemplate: '{"username": "appuser"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '"@/\\'
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-rds-credentials"

  # RDS Instance
  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-postgres-v2"
      Engine: postgres
      EngineVersion: "15.8"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp2
      MultiAZ: false
      DBName: !Sub "photodb"
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !Ref RDSSecurityGroupId
      DBSubnetGroupName: !Ref DBSubnetGroup
      MasterUsername: !Sub "{{resolve:secretsmanager:${RDSSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${RDSSecret}:SecretString:password}}"
      BackupRetentionPeriod: 1
      DeletionProtection: false
      DeleteAutomatedBackups: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-postgres"

Outputs:
  RDSInstanceEndpoint:
    Description: Endpoint of the RDS instance
    Value: !GetAtt RDSInstance.Endpoint.Address
  RDSSecretArn:
    Description: ARN of the RDS secrets
    Value: !Ref RDSSecret
    Export:
      Name: !Sub "${AWS::StackName}-RDSSecretArn"
